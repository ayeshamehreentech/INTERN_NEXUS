events { worker_connections 256; }
http {
    limit_req_zone $binary_remote_addr zone=pyquest:10m rate=5r/s;
    server {
        listen 8080;
        client_max_body_size 16k;
        location / {
            limit_req zone=pyquest burst=20 nodelay;
            proxy_pass http://127.0.0.1:8770;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }
    }
}
